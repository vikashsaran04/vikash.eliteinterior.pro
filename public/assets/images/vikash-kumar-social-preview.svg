    <circle cx="180" cy="180" r="90" fill="#FFFFFF" stroke="url(#sBlue)" stroke-width="3" filter="url(#cardShadow)" />
    
    <g fill="none" stroke="url(#sBlue)" stroke-width="12" stroke-linecap="round" stroke-linejoin="round">
