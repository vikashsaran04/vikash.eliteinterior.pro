<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 750" width="600" height="750">
  <defs>
    <linearGradient id="pBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#F8F8F6" />
      <stop offset="100%" stop-color="#EDEDE8" />
    </linearGradient>
    <linearGradient id="gold" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FCD34D" />
      <stop offset="50%" stop-color="#EFAA27" />
      <stop offset="100%" stop-color="#B47209" />
    </linearGradient>
    <filter id="cardShadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="12" stdDeviation="20" flood-color="#000000" flood-opacity="0.06" />
    </filter>
  </defs>

  <rect width="600" height="750" fill="url(#pBg)" />
  <rect x="20" y="20" width="560" height="710" rx="28" fill="#FFFFFF" stroke="#EAEAEA" stroke-width="2" filter="url(#cardShadow)" />
  
  <!-- Architectural grid background detail -->
  <g stroke="#F0F0EC" stroke-width="1" stroke-dasharray="4,8">
    <line x1="60" y1="60" x2="60" y2="690" />
    <line x1="180" y1="60" x2="180" y2="690" />
    <line x1="300" y1="60" x2="300" y2="690" />
    <line x1="420" y1="60" x2="420" y2="690" />
    <line x1="540" y1="60" x2="540" y2="690" />
    
    <line x1="40" y1="120" x2="560" y2="120" />
    <line x1="40" y1="240" x2="560" y2="240" />
    <line x1="40" y1="360" x2="560" y2="360" />
    <line x1="40" y1="480" x2="560" y2="480" />
    <line x1="40" y1="600" x2="560" y2="600" />
  </g>

  <!-- Central Executive Emblem Frame -->
  <g transform="translate(300, 290)">
    <circle cx="0" cy="0" r="130" fill="#FCFCFA" stroke="#EAEAEA" stroke-width="2" />
    <circle cx="0" cy="0" r="116" fill="#FFFFFF" stroke="url(#gold)" stroke-width="4" stroke-opacity="0.8" />
    
    <!-- Monogram VK -->
    <g fill="none" stroke="url(#gold)" stroke-width="16" stroke-linecap="round" stroke-linejoin="round">
      <path d="M-60 -45 L-20 50 L15 -20" />
      <path d="M22 -55 L22 55" />
      <path d="M68 -35 L26 10 L70 55" />
    </g>
  </g>

  <!-- Text and labels below portrait emblem -->
  <text x="300" y="480" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="28" font-weight="800" fill="#111111" letter-spacing="1">
    VIKASH KUMAR
  </text>
  
  <text x="300" y="515" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="16" font-weight="600" fill="#EFAA27" letter-spacing="2">
    CO-FOUNDER · ELITE INTERIOR
  </text>

  <text x="300" y="555" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="14" font-weight="400" fill="#666666">
    Ahmedabad, Gujarat · India
  </text>

  <!-- Verified credential pill -->
  <g transform="translate(180, 600)">
    <rect width="240" height="38" rx="19" fill="#F8F8F6" stroke="#EAEAEA" stroke-width="1.5" />
    <circle cx="28" cy="19" r="6" fill="#EFAA27" />
    <text x="44" y="24" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="600" fill="#333333">
      VERIFIED IDENTITY PROFILE
    </text>
  </g>

  <!-- Golden corner accent lines -->
  <path d="M 40 70 L 40 40 L 70 40" fill="none" stroke="url(#gold)" stroke-width="3" stroke-linecap="round" />
  <path d="M 530 40 L 560 40 L 560 70" fill="none" stroke="url(#gold)" stroke-width="3" stroke-linecap="round" />
  <path d="M 40 680 L 40 710 L 70 710" fill="none" stroke="url(#gold)" stroke-width="3" stroke-linecap="round" />
  <path d="M 530 710 L 560 710 L 560 680" fill="none" stroke="url(#gold)" stroke-width="3" stroke-linecap="round" />
</svg>
